<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Submission Portal</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #1a365d; }
    form { background: #f7fafc; padding: 24px; border-radius: 8px;
           border: 1px solid #e2e8f0; margin-bottom: 32px; }
    label { display: block; font-weight: bold; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 4px;
            border: 1px solid #cbd5e0; border-radius: 4px; }
    button { margin-top: 16px; padding: 10px 24px; background: #2563eb;
             color: white; border: none; border-radius: 4px; cursor: pointer;
             font-size: 15px; }
    button:hover { background: #1d4ed8; }
    .msg { padding: 10px; border-radius: 4px; margin-top: 12px; }
    .msg.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .msg.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 10px; border: 1px solid #e2e8f0; }
    th { background: #2563eb; color: white; }
    tr:nth-child(even) { background: #f7fafc; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>Assignment Submission Portal</h1>

  <form id="form">
    <label>Student Name</label>
    <input id="name" name="name" required>
    <label>Registration Number</label>
    <input id="regNumber" name="regNumber" required
           placeholder="e.g. FA23-BAI-009">
    <label>Assignment Title</label>
    <input id="title" name="title" required>
    <label>Submission URL</label>
    <input id="url" name="url" type="url" required
           placeholder="https://github.com/...">
    <button type="submit">Submit</button>
    <div id="msg"></div>
  </form>

  <h2>Submissions</h2>
  <table>
    <thead>
      <tr><th>Name</th><th>Reg #</th>
          <th>Title</th><th>URL</th><th>Date</th></tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <script>
    const form = document.getElementById('form');
    const msg  = document.getElementById('msg');
    const list = document.getElementById('list');

    async function loadSubmissions() {
      const res  = await fetch('/submissions');
      const data = await res.json();
      list.innerHTML = data.map(s => `
        <tr>
          <td>${s.name}</td><td>${s.regNumber}</td>
          <td>${s.title}</td>
          <td><a href="${s.url}" target="_blank">Link</a></td>
          <td>${new Date(s.date).toLocaleString()}</td>
        </tr>`).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name:      document.getElementById('name').value,
        regNumber: document.getElementById('regNumber').value,
        title:     document.getElementById('title').value,
        url:       document.getElementById('url').value
      };
      const res = await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        msg.className = 'msg ok';
        msg.textContent = data.message;
        form.reset();
        loadSubmissions();
      } else {
        msg.className = 'msg err';
        msg.textContent = data.error;
      }
    });

    loadSubmissions();
  </script>
</body>
</html>
