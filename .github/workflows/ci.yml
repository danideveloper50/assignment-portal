name: CI Pipeline

on:
  push:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and capture results
        id: tests
        run: |
          npm test -- --json --outputFile=test-results.json 2>&1 || true
          node -e "
            const r = require('./test-results.json');
            const passed = r.numPassedTests;
            const failed = r.numFailedTests;
            const total  = r.numTotalTests;
            const status = failed === 0 ? 'passed' : 'failed';
            const tests  = r.testResults.flatMap(s => s.assertionResults).map(t => ({
              name: t.title,
              result: t.status === 'passed' ? 'passed' : 'failed',
              failureMessage: t.failureMessages.join(' ') || null
            }));
            const fs = require('fs');
            fs.writeFileSync('parsed-results.json', JSON.stringify({
              passed, failed, total, status, tests
            }));
          "

      - name: Send report to local receiver
        run: |
          PARSED=$(cat parsed-results.json)
          PAYLOAD=$(node -e "
            const p = JSON.parse(process.argv[1]);
            const report = {
              repository: '${{ github.repository }}',
              branch: '${{ github.ref_name }}',
              commitSHA: '${{ github.sha }}',
              pipelineRunId: '${{ github.run_id }}',
              timestamp: new Date().toISOString(),
              tests: p.tests,
              summary: {
                total: p.total,
                passed: p.passed,
                failed: p.failed,
                status: p.status
              }
            };
            console.log(JSON.stringify(report));
          " "$PARSED")

          echo "Sending report to receiver..."
          curl -X POST "${{ secrets.RECEIVER_URL }}/report" \
            -H "Content-Type: application/json" \
            -H "ngrok-skip-browser-warning: true" \
            -d "$PAYLOAD" \
            --fail --max-time 30 || echo "⚠ Receiver not reachable"

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}] Test Report — Commit ${{ github.sha }}
          to: ${{ secrets.REPORT_EMAIL }}
          from: CI Pipeline <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Test Report for ${{ github.repository }}

            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Run ID  : ${{ github.run_id }}

            Full results are attached.
          attachments: parsed-results.json

      - name: Fail pipeline if tests failed
        run: |
          STATUS=$(node -e "
            const r = require('./parsed-results.json');
            console.log(r.status);
          ")
          if [ "$STATUS" = "failed" ]; then
            echo "❌ Tests failed!"
            exit 1
          fi
          echo "✅ All tests passed!"

  deploy:
    needs: test
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './views'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4